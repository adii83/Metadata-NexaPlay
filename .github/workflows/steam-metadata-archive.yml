name: Steam Metadata Archive

on:
  workflow_dispatch:
  schedule:
    # Harian (UTC). Ubah sesuai kebutuhan.
    - cron: "10 0 * * *"

permissions:
  contents: write

concurrency:
  group: steam-metadata-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
      COMMIT_USER_NAME: ${{ secrets.COMMIT_USER_NAME }}
      COMMIT_USER_EMAIL: ${{ secrets.COMMIT_USER_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run archiver (30k per day)
        run: |
          git config user.name "${COMMIT_USER_NAME:-${GITHUB_ACTOR}}"
          git config user.email "${COMMIT_USER_EMAIL:-${GITHUB_ACTOR}@users.noreply.github.com}"

          # 60 x 500 = 30.000 App ID per run harian
          for i in $(seq 1 60); do
            echo "=== Siklus $i/60 (500 App ID) ==="
            if [ "$i" -eq 1 ]; then
              python final/steam_metadata_NP.py \
                --batch-size 500 \
                --sleep-seconds 1.0 \
                --refresh-snapshot \
                --auto-push-every 0
            else
              python final/steam_metadata_NP.py \
                --batch-size 500 \
                --sleep-seconds 1.0 \
                --auto-push-every 0
            fi

            python final/build_runtime_catalog.py
            python final/build_index.py

            if git diff --quiet -- dist; then
              echo "Tidak ada perubahan dist/ di siklus $i"
              continue
            fi

            git add dist
            git commit -m "Update Steam metadata archive (+500 appids, siklus $i/60)" || true
            git push
          done
