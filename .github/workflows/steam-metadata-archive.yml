name: Steam Metadata Archive

on:
  workflow_dispatch:
  schedule:
    # Harian (UTC). Ubah sesuai kebutuhan.
    - cron: "10 0 * * *"

permissions:
  contents: write

concurrency:
  group: steam-metadata-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
      COMMIT_USER_NAME: ${{ secrets.COMMIT_USER_NAME }}
      COMMIT_USER_EMAIL: ${{ secrets.COMMIT_USER_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run archiver (10k per day)
        run: |
          python final/steam_metadata_NP.py \
            --batch-size 10000 \
            --sleep-seconds 0.2 \
            --refresh-snapshot \
            --auto-push-every 0

      - name: Commit and push dist
        run: |
          if git diff --quiet -- dist; then
            echo "No changes in dist/"
            exit 0
          fi

          git config user.name "${COMMIT_USER_NAME:-${GITHUB_ACTOR}}"
          git config user.email "${COMMIT_USER_EMAIL:-${GITHUB_ACTOR}@users.noreply.github.com}"

          git add dist
          git commit -m "Update Steam metadata archive (daily 10k)"
          git push
