name: Build Steam Metadata Archive

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Batasi jumlah App ID untuk test. Kosongkan untuk semua."
        required: false
        default: "0"
      max_file_size_mb:
        description: "Ukuran maksimum file JSON per chunk dalam MB."
        required: false
        default: "25"
      sleep_seconds:
        description: "Delay antar App ID untuk mengurangi risiko rate limit."
        required: false
        default: "1"
      force_refresh:
        description: "true untuk memproses ulang semua App ID walau sudah ada di dist."
        required: false
        default: "false"
  schedule:
    - cron: "15 1 * * *"

jobs:
  build-archive:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build metadata archive
        env:
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
        run: |
          LIMIT_INPUT="${{ github.event.inputs.limit }}"
          MAX_MB_INPUT="${{ github.event.inputs.max_file_size_mb }}"
          SLEEP_INPUT="${{ github.event.inputs.sleep_seconds }}"
          FORCE_REFRESH_INPUT="${{ github.event.inputs.force_refresh }}"

          if [ -z "$LIMIT_INPUT" ]; then LIMIT_INPUT="0"; fi
          if [ -z "$MAX_MB_INPUT" ]; then MAX_MB_INPUT="25"; fi
          if [ -z "$SLEEP_INPUT" ]; then SLEEP_INPUT="1"; fi
          if [ -z "$FORCE_REFRESH_INPUT" ]; then FORCE_REFRESH_INPUT="false"; fi

          EXTRA_ARGS=""
          if [ "$FORCE_REFRESH_INPUT" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force-refresh"
          fi

          python final/steam_metadata_NP.py \
            --output-dir dist \
            --file-prefix steam_metadata_NP \
            --limit "$LIMIT_INPUT" \
            --max-file-size-mb "$MAX_MB_INPUT" \
            --sleep-seconds "$SLEEP_INPUT" \
            $EXTRA_ARGS

      - name: Commit generated files
        env:
          COMMIT_USER_NAME: ${{ secrets.COMMIT_USER_NAME }}
          COMMIT_USER_EMAIL: ${{ secrets.COMMIT_USER_EMAIL }}
        run: |
          git config user.name "$COMMIT_USER_NAME"
          git config user.email "$COMMIT_USER_EMAIL"

          if [ -z "$(git status --porcelain -- dist)" ]; then
            echo "Tidak ada perubahan output."
            exit 0
          fi

          git add dist
          git commit -m "Update Steam metadata archive"

      - name: Push as repository owner identity
        env:
          GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          if git diff --cached --quiet; then
            echo "Tidak ada commit baru untuk di-push."
            exit 0
          fi

          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:${GITHUB_REF_NAME}
